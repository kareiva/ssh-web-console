on:
  pull_request:
  push:
    tags:
      - 'v*'

name: Build&Release

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.18

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Build static
        run: cd web && yarn && yarn build && cd ../

      - name: Get Go dependencies
        run: go mod download && go install github.com/rakyll/statik@v0.1.8

      - name: Static->GO generation
        run: statik --src=web/build

      - name: Build
        run: make VERSION=${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: ssh-web-console-*

  container:
    name: Alpine Linux container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ github.ref_name }}
          load: true
          tags: ssh-web-console:smoke-test
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker run --rm ssh-web-console:smoke-test ./ssh-web-console -version
          docker run -d --name swc -p 2222:2222 -v "$PWD/conf:/home/web/conf:ro" ssh-web-console:smoke-test
          for i in $(seq 1 10); do curl -fsS http://127.0.0.1:2222/ -o page.html && break; sleep 1; done
          grep '<title>SSH Web Console</title>' page.html || { docker logs swc; exit 1; }
          docker rm -f swc

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  freebsd-test:
    name: FreeBSD ${{ matrix.name }} smoke test
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: '15.1'
            release: '15.1'
          - name: latest
            release: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Run on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          copyback: false
          run: |
            set -e
            freebsd-version
            chmod +x ssh-web-console-freebsd-amd64
            ./ssh-web-console-freebsd-amd64 -version
            ./ssh-web-console-freebsd-amd64 -config conf/config.yaml > server.log 2>&1 &
            pid=$!
            sleep 3
            fetch -qo - http://127.0.0.1:2222/ | grep '<title>SSH Web Console</title>' || { cat server.log; exit 1; }
            kill $pid

  container-freebsd:
    name: FreeBSD container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist

      - name: Resolve FreeBSD release
        id: base
        run: |
          release=$(curl -fsSL "https://hub.docker.com/v2/repositories/freebsd/freebsd-runtime/tags?page_size=100" \
            | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          test -n "$release"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-freebsd
            type=raw,value=freebsd,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: dist
          file: Dockerfile.freebsd
          platforms: freebsd/amd64,freebsd/arm64
          build-args: FREEBSD_RELEASE=${{ steps.base.outputs.release }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: On Release
    needs: [build, freebsd-test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
      - run: ls -R

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ssh-web-console-linux-amd64
            ssh-web-console-linux-arm64
            ssh-web-console-darwin-amd64
            ssh-web-console-windows-amd64.exe
            ssh-web-console-freebsd-amd64
            ssh-web-console-freebsd-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
